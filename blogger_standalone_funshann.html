<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:b="http://www.google.com/2005/gml/b" xmlns:data="http://www.google.com/2005/gml/data" xmlns:expr="http://www.google.com/2005/gml/expr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Funshann - Social Network</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0F172A" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100dvh; background:#f4f7fb; font-family:sans-serif; touch-action:manipulation; overscroll-behavior:none; }
    ::-webkit-scrollbar { display:none; }
    .nav-bar, .header, .footer, .blog-pager, .post-feeds, .widget, .sidebar { display:none !important; }
  </style>
</head>
<body class="bg-[#f4f7fb] text-[#0f172a] overflow-x-hidden">
  <div id="root"></div>
  <div id="recaptcha-container"></div>
  <script type="text/babel">
  const { useState, useEffect } = React;
  const firebaseConfig = { apiKey: "AIzaSyCMiX4Gx8vqrFFqfl3XBsLfMZI5hCpySDg", authDomain: "gen-lang-client-0528558677.firebaseapp.com", projectId: "gen-lang-client-0528558677", storageBucket: "gen-lang-client-0528558677.firebasestorage.app", messagingSenderId: "585330478854", appId: "1:585330478854:web:7d80fe760d21cfcc8e9887" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const App = () => {
    const [user, setUser] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      return auth.onAuthStateChanged((u) => {
        setUser(u);
        setLoading(false);
      });
    }, []);

    if (loading) return <div className="h-screen flex items-center justify-center">Loading...</div>;
    return user ? <MainApp user={user} /> : <AuthScreen />;
  };

  const AuthScreen = () => {
    const [phone, setPhone] = useState('');
    const [otp, setOtp] = useState('');
    const [confirmResult, setConfirmResult] = useState(null);

    const googleLogin = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
    
    const sendOTP = async () => {
      const verifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' });
      setConfirmResult(await auth.signInWithPhoneNumber(phone, verifier));
    };

    const verifyOTP = async () => {
      try {
        await confirmResult.confirm(otp);
      } catch (e) {
        alert("Invalid OTP");
      }
    };

    return (
      <div className="h-screen flex flex-col items-center justify-center p-6 gap-4">
        <button onClick={googleLogin} className="w-full p-4 bg-white border rounded-2xl">Sign in with Google</button>
        <input className="w-full p-4 border rounded-2xl" placeholder="Phone (+1...)" onChange={e => setPhone(e.target.value)} />
        <button onClick={sendOTP} className="w-full p-4 bg-slate-800 text-white rounded-2xl">Send SMS OTP</button>
        <input className="w-full p-4 border rounded-2xl" placeholder="OTP" onChange={e => setOtp(e.target.value)} />
        <button onClick={verifyOTP} className="w-full p-4 bg-blue-600 text-white rounded-2xl">Verify OTP & Login</button>
      </div>
    );
  };

  const MainApp = ({user}) => {
    const [activeTab, setActiveTab] = useState('home');
    return (
      <div className="h-full">
        {activeTab === 'home' && <div className="p-4">Welcome, {user.displayName || user.phoneNumber}!</div>}
        <button onClick={() => auth.signOut()} className="m-4 p-2 bg-red-100 text-red-600 rounded-xl">Logout</button>
        <nav className="fixed bottom-[calc(1rem+env(safe-area-inset-bottom))] left-4 right-4 bg-white/90 backdrop-blur border rounded-full p-2 flex justify-between shadow-xl z-50">
          {['home','search','plus','messages','profile'].map(t => (
            <button key={t} onClick={() => setActiveTab(t)} className="p-3 text-slate-500 font-bold capitalize">{t}</button>
          ))}
        </nav>
      </div>
    );
  };

  ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
