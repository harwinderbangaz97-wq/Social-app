<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:b="http://www.google.com/2005/gml/b" xmlns:data="http://www.google.com/2005/gml/data" xmlns:expr="http://www.google.com/2005/gml/expr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Funshann - Social Network</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0F172A" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100dvh; background:#f4f7fb; font-family:sans-serif; touch-action:manipulation; overscroll-behavior:none; }
    ::-webkit-scrollbar { display:none; }
    .nav-bar, .header, .footer, .blog-pager, .post-feeds, .widget, .sidebar { display:none !important; }
  </style>
</head>
<body class="bg-[#f4f7fb] text-[#0f172a] overflow-x-hidden">
  <div id="root"></div>
  <script type="text/babel">
  const { useState, useEffect, useRef } = React;
  const firebaseConfig = { apiKey: "AIzaSyCMiX4Gx8vqrFFqfl3XBsLfMZI5hCpySDg", authDomain: "gen-lang-client-0528558677.firebaseapp.com", projectId: "gen-lang-client-0528558677", storageBucket: "gen-lang-client-0528558677.firebasestorage.app", messagingSenderId: "585330478854", appId: "1:585330478854:web:7d80fe760d21cfcc8e9887" };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const App = () => {
    const [user, setUser] = useState(null);
    const [posts, setPosts] = useState([]);
    const [chats, setChats] = useState([]);
    const [activeTab, setActiveTab] = useState('home');
    const [activeChat, setActiveChat] = useState(null);
    const [loading, setLoading] = useState(true);

    useEffect(() => {
      auth.onAuthStateChanged(async (u) => {
        if (u) {
          const doc = await db.collection('users').doc(u.uid).get();
          if (doc.exists) setUser(doc.data());
          else {
            const newUser = { id: u.uid, name: u.displayName || 'User', username: 'u_'+u.uid.slice(0,4), avatar: u.photoURL || 'https://api.dicebear.com/7.x/avataaars/svg?seed='+u.uid };
            await db.collection('users').doc(u.uid).set(newUser);
            setUser(newUser);
          }
        }
        setLoading(false);
      });
      db.collection('posts').onSnapshot(s => setPosts(s.docs.map(d => ({ id: d.id, ...d.data() }))));
      db.collection('chats').onSnapshot(s => setChats(s.docs.map(d => ({ id: d.id, ...d.data() }))));
    }, []);

    if (loading) return <div className="h-screen flex items-center justify-center">Loading...</div>;
    if (!user) return <div className="h-screen flex items-center justify-center"><button onClick={() => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())} className="p-4 bg-blue-600 text-white rounded-2xl">Sign in with Google</button></div>;

    return (
      <div className="pb-24">
        {activeChat ? <ChatView chat={activeChat} user={user} close={() => setActiveChat(null)} /> : (
          <>
            {activeTab === 'home' && <Home posts={posts} />}
            {activeTab === 'profile' && <Profile user={user} />}
            <nav className="fixed bottom-[calc(1rem+env(safe-area-inset-bottom))] left-4 right-4 bg-white/90 backdrop-blur border rounded-full p-2 flex justify-between shadow-xl z-50">
              {['home','search','plus','messages','profile'].map(t => (
                <button key={t} onClick={() => setActiveTab(t)} className="p-3 text-slate-500 font-bold capitalize">{t}</button>
              ))}
            </nav>
          </>
        )}
      </div>
    );
  };

  const Home = ({posts}) => (
    <div className="p-4 space-y-4">
      {posts.map(p => <div key={p.id} className="bg-white p-4 rounded-3xl shadow-sm">{p.caption}</div>)}
    </div>
  );

  const Profile = ({user}) => (
    <div className="p-8 text-center">
      <img src={user.avatar} className="w-24 h-24 rounded-full mx-auto" />
      <h2 className="text-xl font-bold mt-4">{user.name}</h2>
      <p className="text-slate-500">@{user.username}</p>
    </div>
  );

  const ChatView = ({chat, user, close}) => (
    <div className="fixed inset-0 bg-[#f4f7fb] flex flex-col z-50">
      <header className="p-4 border-b bg-white flex justify-between">
        <button onClick={close}>Back</button>
        <h2 className="font-bold">{chat.name}</h2>
      </header>
      <div className="flex-1 p-4 space-y-2 overflow-y-auto">
        {chat.messages?.map(m => <div key={m.id} className="bg-white p-3 rounded-2xl shadow-sm">{m.text}</div>)}
      </div>
      <div className="p-4 bg-white flex gap-2 border-t">
        <input className="flex-1 bg-slate-100 p-2 rounded-xl" placeholder="Message..." />
        <button className="bg-blue-600 text-white p-2 rounded-xl">Send</button>
      </div>
    </div>
  );

  ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
